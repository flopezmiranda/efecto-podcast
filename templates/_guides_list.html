<ul class="guide-list">
  {% for g in guides %}
  <li><a href="{{ g.url }}">
    <span class="eyebrow grad-text">Guía · {{ g.minutes }} min</span>
    <strong>{{ g.title }}</strong>
    <span class="muted">{{ g.description }}</span>
    <span class="guide-more">Leer la guía →</span>
  </a></li>
  {% endfor %}
</ul>
