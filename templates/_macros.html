{% macro ad(slot) -%}
{# Sin slot no se dibuja nada: los anuncios automáticos de AdSense eligen dónde ponerlos. #}
{% if site.adsense_client and slot %}
<div class="ad" aria-label="Publicidad">
  <ins class="adsbygoogle" style="display:block" data-ad-client="{{ site.adsense_client }}" data-ad-slot="{{ slot }}" data-ad-format="auto" data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>
{% endif %}
{%- endmacro %}
