{% macro ad(slot) -%}
{% if site.adsense_client %}
<div class="ad" aria-label="Publicidad">
  <ins class="adsbygoogle" style="display:block" data-ad-client="{{ site.adsense_client }}"{% if slot %} data-ad-slot="{{ slot }}"{% endif %} data-ad-format="auto" data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>
{% endif %}
{%- endmacro %}
