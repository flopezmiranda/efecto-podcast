name: Descargar transcripciones

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Cuántos episodios procesar (0 = todos los que faltan)"
        default: "0"

permissions:
  contents: write

jobs:
  transcripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: denoland/setup-deno@v2

      - run: pip install -U "yt-dlp[default]"

      - run: python scripts/fetch_transcripts.py --limit ${{ inputs.limit }}

      # Al subir las transcripciones se dispara la publicación del sitio.
      - name: Guardar transcripciones
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/transcripts
          git diff --cached --quiet || (git commit -m "Agregar transcripciones" && git push)
