name: Importar episodios y publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 10 * * *" # todos los días; los episodios nuevos aparecen solos
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install jinja2 pillow

      - name: Importar videos de YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        if: env.YOUTUBE_API_KEY != ''
        run: python scripts/fetch_youtube.py

      # Guarda la lista en el repo para que las URLs de cada episodio nunca cambien.
      - name: Guardar episodios importados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/episodes.json
          git diff --cached --quiet || (git commit -m "Actualizar episodios" && git push)

      - run: python scripts/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Con el sitio ya publicado, avisa a Bing de las páginas nuevas o modificadas.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install jinja2 pillow

      - run: python scripts/build.py && python scripts/indexnow.py

      - name: Guardar estado de IndexNow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/indexnow.json data/lastmod.json
          git diff --cached --quiet || (git commit -m "Registrar aviso a IndexNow" && git pull --rebase && git push)
